name: Computer browser acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Record exact revisions and clean checkout
        run: |
          git rev-parse HEAD
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Install locked test tools
        working-directory: qa/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Prove environment before application tests
        working-directory: qa/browser
        run: xvfb-run -a npm run preflight
      - name: Technical tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          npm test
          npm run validate
          npm run validate:exercises
          python3 tests/installer.test.py
          python3 tests/upgrade-learning.test.py
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 tests/upgrade-beginner.test.py
      - name: Both browser entry points with fixture accounts
        working-directory: qa/browser
        run: xvfb-run -a npm test
      - name: Confirm no tracked or untracked source changes
        run: |
          git diff --exit-code
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: computer-browser-acceptance-${{ github.sha }}
          path: qa/browser/results/report.json
          if-no-files-found: warn
          retention-days: 14
